<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>App Store</title>
<meta name="theme-color" content="#080b13">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --header-h:64px;
  --brand-1:#6366f1;--brand-2:#a855f7;
  --brand-grad:linear-gradient(135deg,#6366f1 0%,#a855f7 100%);
  --radius-sm:10px;--radius:14px;--radius-lg:18px;--radius-xl:24px;
}
html[data-theme="dark"]{
  --bg:#080b13;--bg-soft:#0d1119;--bg-elev:#121826;
  --card:#131a29;--card-2:#182032;--card-3:#1e2740;
  --border:#1e2740;--border-2:#2a3550;
  --text:#eef2fb;--text-2:#c3ccdf;
  --muted:#7583a0;--muted-2:#5a6782;
  --shadow-lg:0 20px 48px -16px rgba(0,0,0,.75);
  --shadow-glow:0 8px 28px -10px rgba(99,102,241,.55);
  --input-bg:#131a29;--overlay-bg:rgba(4,7,12,.78);
  --glass:rgba(19,26,41,.72);
  --hero-from:rgba(99,102,241,.22);
  --hero-to:rgba(168,85,247,.08);
}
html[data-theme="light"]{
  --bg:#f5f6fb;--bg-soft:#ffffff;--bg-elev:#ffffff;
  --card:#ffffff;--card-2:#f8f9fd;--card-3:#eef1f9;
  --border:#e4e8f2;--border-2:#d4dae8;
  --text:#0f1422;--text-2:#3a4459;
  --muted:#6b7590;--muted-2:#8a94ab;
  --shadow-lg:0 20px 48px -16px rgba(30,41,80,.16);
  --shadow-glow:0 8px 28px -10px rgba(99,102,241,.4);
  --input-bg:#ffffff;--overlay-bg:rgba(15,20,34,.5);
  --glass:rgba(255,255,255,.75);
  --hero-from:rgba(99,102,241,.14);
  --hero-to:rgba(168,85,247,.05);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:14px;line-height:1.5;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;transition:background .3s,color .3s;
}
body.locked{overflow:hidden}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font-family:inherit}

.ic{width:20px;height:20px;display:inline-block;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}
.ic-sm{width:16px;height:16px}
.ic-lg{width:24px;height:24px}
.ic-fill{fill:currentColor;stroke:none}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sh{0%{background-position:150% 0}100%{background-position:-50% 0}}
@keyframes heartPop{0%{transform:scale(1)}40%{transform:scale(1.35)}70%{transform:scale(.95)}100%{transform:scale(1)}}

/* ============ HEADER ============ */
.app-header{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  display:flex;align-items:center;gap:10px;padding:0 12px;
  background:var(--glass);backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid var(--border);z-index:100;transition:.3s;
}
.icon-btn{
  width:42px;height:42px;flex:0 0 42px;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  color:var(--text);cursor:pointer;transition:.18s;
}
.icon-btn:hover{background:var(--card-2);border-color:var(--border-2);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.92)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand-logo{
  width:40px;height:40px;border-radius:13px;flex:0 0 40px;
  background:var(--brand-grad);
  box-shadow:var(--shadow-glow),inset 0 1px 0 rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:17px;color:#fff;overflow:hidden;position:relative;
}
.brand-logo::after{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.3),transparent 55%);pointer-events:none}
.brand-logo img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
.brand-text{min-width:0;flex:1}
.brand-name{font-size:15px;font-weight:800;letter-spacing:-.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.brand-ver{font-size:10.5px;color:var(--muted);line-height:1.35;font-weight:500}
.account-btn{
  display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 14px;
  border-radius:12px;background:var(--card);border:1px solid var(--border);
  color:var(--text);cursor:pointer;font-size:13px;font-weight:600;
  transition:.18s;white-space:nowrap;
}
.account-btn:hover{background:var(--card-2);border-color:var(--border-2)}
.account-btn:active{transform:scale(.95)}
.account-btn.logged-in{background:var(--brand-grad);border-color:transparent;color:#fff;
  box-shadow:var(--shadow-glow)}
.acc-label{display:none;max-width:90px;overflow:hidden;text-overflow:ellipsis}
@media(min-width:520px){.acc-label{display:inline-block}}

/* ============ SEARCH ============ */
.search-wrap{
  padding:16px 16px 10px;position:sticky;top:var(--header-h);z-index:50;
  background:linear-gradient(to bottom,var(--bg) 65%,transparent);
}
.search-shell{
  position:relative;border-radius:16px;padding:1.5px;
  background:linear-gradient(135deg,rgba(99,102,241,.28),rgba(168,85,247,.22));
  transition:.3s;box-shadow:0 4px 18px -10px rgba(99,102,241,.4);
}
.search-shell:focus-within{
  background:linear-gradient(135deg,#6366f1,#a855f7);
  box-shadow:0 10px 28px -12px rgba(99,102,241,.7),0 0 0 4px rgba(99,102,241,.1);
}
.search-box{
  display:flex;align-items:center;gap:11px;
  background:var(--input-bg);border-radius:14.5px;padding:0 15px;height:50px;
}
.search-box .search-ic{color:var(--muted);transition:.25s;flex:0 0 20px}
.search-shell:focus-within .search-ic{color:var(--brand-1)}
.search-box input{flex:1;background:none;border:none;outline:none;
  color:var(--text);font-size:14px;font-weight:500}
.search-box input::placeholder{color:var(--muted-2)}
.search-clear{
  width:26px;height:26px;border-radius:50%;flex:0 0 26px;
  display:none;align-items:center;justify-content:center;
  background:var(--card-3);color:var(--muted);cursor:pointer;transition:.2s;
}
.search-clear:hover{background:var(--border-2);color:var(--text)}
.search-clear.show{display:inline-flex}
.search-clear .ic{width:13px;height:13px;stroke-width:2.5}

/* ============ SIDEBAR ============ */
.overlay{position:fixed;inset:0;background:var(--overlay-bg);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  z-index:200;opacity:0;visibility:hidden;transition:.25s}
.overlay.show{opacity:1;visibility:visible}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:292px;max-width:85vw;
  background:var(--bg-soft);border-right:1px solid var(--border);
  z-index:210;display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .32s cubic-bezier(.4,0,.2,1);
  box-shadow:24px 0 60px -20px rgba(0,0,0,.5);
}
.sidebar.show{transform:translateX(0)}
.sb-head{display:flex;align-items:center;gap:11px;padding:14px 16px;
  border-bottom:1px solid var(--border);min-height:var(--header-h)}
.sb-head .brand-logo{width:36px;height:36px;flex:0 0 36px;font-size:15px;border-radius:11px}
.sb-close{margin-left:auto;width:38px;height:38px;flex:0 0 38px}
.sb-scroll{flex:1;overflow-y:auto;padding:10px 10px 24px}
.sb-title{font-size:10.5px;font-weight:800;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--muted-2);padding:14px 12px 8px}
.cat-item{
  display:flex;align-items:center;gap:12px;padding:11px 12px;
  border-radius:12px;cursor:pointer;color:var(--text-2);
  font-size:14px;font-weight:600;transition:.15s;margin-bottom:3px;
  user-select:none;border:1px solid transparent;position:relative;
}
.cat-item:hover{background:var(--card);color:var(--text)}
.cat-item.active{background:linear-gradient(135deg,rgba(99,102,241,.14),rgba(168,85,247,.08));
  color:var(--text);border-color:rgba(99,102,241,.28)}
.cat-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;
  background:var(--brand-grad);border-radius:0 3px 3px 0}
.cat-item .ci{width:24px;height:24px;flex:0 0 24px;display:flex;
  align-items:center;justify-content:center;color:var(--muted)}
.cat-item.active .ci{color:var(--brand-1)}
.cat-item .cn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-item .cc{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;
  background:var(--card-2);color:var(--muted);min-width:24px;text-align:center;line-height:1.6}
.cat-item.active .cc{background:rgba(99,102,241,.2);color:var(--brand-1)}
.sb-divider{height:1px;background:var(--border);margin:12px 10px}

/* ============ MAIN ============ */
.app-main{padding-top:var(--header-h);min-height:100vh;padding-bottom:110px}

/* ============ HOME ============ */
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 16px 12px;gap:10px;
}
.section-title{
  font-size:18px;font-weight:800;letter-spacing:-.4px;
  display:flex;align-items:center;gap:10px;
}
.section-title .ico-wrap{
  width:30px;height:30px;border-radius:9px;
  background:var(--brand-grad);display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px -6px rgba(99,102,241,.5);color:#fff;
}
.section-title .ico-wrap .ic{width:16px;height:16px;stroke-width:2.4}
.section-see-all{font-size:12px;color:var(--brand-1);font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:3px}
.section-see-all .ic{width:13px;height:13px;stroke-width:2.6}
.section-count{font-size:11.5px;color:var(--muted);font-weight:700;
  padding:5px 11px;background:var(--card);border:1px solid var(--border);border-radius:20px}

/* FEATURED HERO */
.hero{
  margin:6px 16px;border-radius:20px;padding:22px;
  background:linear-gradient(135deg,var(--hero-from),var(--hero-to));
  border:1px solid rgba(99,102,241,.24);
  position:relative;overflow:hidden;
  animation:fadeUp .5s cubic-bezier(.4,0,.2,1) both;
}
.hero::before{
  content:'';position:absolute;top:-40%;right:-30%;width:280px;height:280px;
  background:radial-gradient(circle,rgba(168,85,247,.28),transparent 70%);
  border-radius:50%;pointer-events:none;
}
.hero-content{position:relative;z-index:1;display:flex;align-items:center;gap:16px}
.hero-icon{
  width:72px;height:72px;flex:0 0 72px;border-radius:19px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:800;color:#fff;
  box-shadow:0 14px 34px -12px rgba(99,102,241,.65),
             inset 0 2px 0 rgba(255,255,255,.2);
  position:relative;
}
.hero-icon::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.22),transparent 55%);
  pointer-events:none;
}
.hero-icon img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
.hero-info{flex:1;min-width:0}
.hero-label{font-size:10.5px;font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--brand-1);margin-bottom:5px;
  display:flex;align-items:center;gap:6px}
.hero-label .ic{width:12px;height:12px;stroke-width:2.6}
.hero-title{font-size:19px;font-weight:800;letter-spacing:-.4px;
  margin-bottom:6px;word-break:break-word;line-height:1.2;color:var(--text)}
.hero-sub{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:12px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;word-break:break-word}
.hero-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 16px;border-radius:11px;
  background:var(--brand-grad);color:#fff;font-size:12.5px;font-weight:700;
  box-shadow:0 6px 18px -8px rgba(99,102,241,.8);transition:.18s;
  border:none;cursor:pointer;
}
.hero-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.hero-btn:active{transform:scale(.97)}
.hero-btn .ic{width:14px;height:14px;stroke-width:2.4}

/* STATS */
.stats-strip{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  margin:16px 16px 0;animation:fadeUp .5s .05s both;
}
.stat-cell{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:14px 12px;text-align:center;transition:.2s;
}
.stat-cell:hover{background:var(--card-2);border-color:var(--border-2);transform:translateY(-2px)}
.stat-num{font-size:22px;font-weight:800;letter-spacing:-.5px;
  background:var(--brand-grad);-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.stat-label{font-size:10.5px;color:var(--muted);font-weight:600;
  text-transform:uppercase;letter-spacing:.5px;margin-top:4px}

/* CHIPS ROW */
.chips-row{
  display:flex;gap:8px;padding:16px 16px 4px;overflow-x:auto;
  scrollbar-width:none;animation:fadeUp .5s .1s both;
}
.chips-row::-webkit-scrollbar{display:none}
.chip-btn{
  flex:0 0 auto;padding:8px 14px;border-radius:20px;
  background:var(--card);border:1px solid var(--border);
  color:var(--text-2);font-size:12.5px;font-weight:600;
  cursor:pointer;transition:.2s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;
}
.chip-btn:hover{background:var(--card-2);border-color:var(--border-2);color:var(--text)}
.chip-btn.active{
  background:var(--brand-grad);border-color:transparent;color:#fff;
  box-shadow:0 6px 16px -6px rgba(99,102,241,.7);
}
.chip-btn .ic{width:14px;height:14px;stroke-width:2.2}

/* HSCROLL */
.hscroll{
  display:flex;gap:12px;overflow-x:auto;padding:2px 16px 8px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.hscroll::-webkit-scrollbar{display:none}
.hscroll-item{
  flex:0 0 130px;scroll-snap-align:start;cursor:pointer;
  transition:.22s cubic-bezier(.4,0,.2,1);
}
.hscroll-item:active{transform:scale(.96)}
.hscroll-item:hover{transform:translateY(-3px)}
.hscroll-icon{
  width:100%;aspect-ratio:1/1;border-radius:18px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:800;color:#fff;
  box-shadow:0 10px 24px -10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.2);
  position:relative;margin-bottom:9px;
}
.hscroll-icon img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
.hscroll-icon::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.2),transparent 55%);
  pointer-events:none;
}
.hscroll-name{
  font-size:12.5px;font-weight:700;line-height:1.35;letter-spacing:-.15px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;word-break:break-word;color:var(--text);text-align:center;
}

/* GRID */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));
  gap:14px;padding:0 14px;
}
@media(max-width:370px){.grid{grid-template-columns:repeat(2,1fr);gap:11px;padding:0 11px}}
.card{
  position:relative;aspect-ratio:1/1;
  background:linear-gradient(160deg,var(--card) 0%,var(--card-2) 100%);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:16px 12px;text-align:center;
  transition:transform .22s cubic-bezier(.4,0,.2,1),border-color .22s,box-shadow .22s;
  isolation:isolate;animation:fadeUp .4s cubic-bezier(.4,0,.2,1) both;
}
.card::before{
  content:'';position:absolute;inset:0;z-index:-1;
  background:radial-gradient(circle at 50% 0%,rgba(99,102,241,.14),transparent 60%);
  opacity:0;transition:opacity .3s;
}
.card:hover{transform:translateY(-4px);border-color:var(--border-2);
  box-shadow:0 18px 40px -16px rgba(0,0,0,.45),0 0 0 1px rgba(99,102,241,.1)}
.card:hover::before{opacity:1}
.card:active{transform:scale(.96)}
.card-icon{
  width:66px;height:66px;flex:0 0 66px;border-radius:19px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:27px;font-weight:800;color:#fff;
  box-shadow:0 10px 24px -10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22);
  position:relative;
}
.card-icon::after{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.2),transparent 55%);pointer-events:none}
.card-icon img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
.card-name{
  font-size:12.5px;font-weight:700;line-height:1.35;letter-spacing:-.15px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;word-break:break-word;color:var(--text);
}

/* BADGE */
.badge{
  position:absolute;top:10px;right:10px;z-index:3;
  font-size:11px;font-weight:800;letter-spacing:.2px;
  padding:5px 13px;border-radius:999px;
  line-height:1.4;white-space:nowrap;color:#fff;text-transform:capitalize;
}
.badge.latest, .badge.newest{background:linear-gradient(90deg,#ec4899 0%,#f472b6 30%,#fb923c 100%)}
.badge.hot, .badge.trending{background:linear-gradient(90deg,#ef4444 0%,#f97316 100%)}
.badge.old{background:linear-gradient(90deg,#78716c 0%,#a8a29e 100%)}
html[data-theme="light"] .badge.old{background:linear-gradient(90deg,#d6d3d1 0%,#a8a29e 100%);color:#44403c}
.badge.new{background:linear-gradient(90deg,#3b82f6 0%,#06b6d4 100%)}
.badge.mod{background:linear-gradient(90deg,#a855f7 0%,#7c3aed 100%)}
.badge.premium, .badge.pro{background:linear-gradient(90deg,#fbbf24 0%,#f59e0b 100%);color:#3b2506}
.badge.coming{background:linear-gradient(90deg,#6366f1 0%,#06b6d4 100%)}
.badge.default{background:var(--card-3);color:var(--text-2);border:1px solid var(--border-2)}

.card.coming .card-icon{filter:grayscale(.65) brightness(.8)}
.card.coming .card-name{color:var(--muted)}
.soon-tag{
  position:absolute;bottom:0;left:0;right:0;z-index:3;
  background:linear-gradient(to top,rgba(99,102,241,.16),transparent);
  color:#a5b4fc;font-size:9.5px;font-weight:800;
  padding:12px 6px 7px;text-align:center;letter-spacing:.8px;
  text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:5px;
}
html[data-theme="light"] .soon-tag{color:#4f46e5}
.soon-tag .ic{width:11px;height:11px;stroke-width:2.5}

/* STATES */
.state{padding:64px 24px;text-align:center;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:14px}
.state .big{width:80px;height:80px;border-radius:24px;
  background:var(--card);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--muted);margin-bottom:4px}
.state .big .ic{width:36px;height:36px;stroke-width:1.6}
.state p{font-size:13.5px;max-width:320px;line-height:1.65}
.state b{color:var(--text-2)}
.spinner{width:36px;height:36px;border-radius:50%;
  border:3px solid var(--border);border-top-color:var(--brand-1);
  animation:spin .8s linear infinite}
.skel{aspect-ratio:1/1;border-radius:var(--radius-lg);
  background:linear-gradient(100deg,var(--card) 30%,var(--card-2) 50%,var(--card) 70%);
  background-size:220% 100%;animation:sh 1.4s infinite;border:1px solid var(--border)}
.skel-hero{margin:6px 16px;height:150px;border-radius:20px;
  background:linear-gradient(100deg,var(--card) 30%,var(--card-2) 50%,var(--card) 70%);
  background-size:220% 100%;animation:sh 1.4s infinite;border:1px solid var(--border)}

/* ============ PRODUCT PAGE ============ */
.product-page{
  position:fixed;inset:0;z-index:260;background:var(--bg);
  display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;
  transition:transform .36s cubic-bezier(.4,0,.2,1),visibility .36s;
}
.product-page.show{transform:translateX(0);visibility:visible}
.product-header{
  height:var(--header-h);flex:0 0 var(--header-h);
  display:flex;align-items:center;gap:10px;padding:0 12px;
  background:var(--glass);backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid var(--border);position:relative;z-index:5;
}
.product-header .title{flex:1;min-width:0;font-size:15px;font-weight:700;
  letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-header .spacer{width:42px;flex:0 0 42px}
.product-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:40px}

.pdp-hero{position:relative;padding:24px 20px 20px;overflow:hidden;
  animation:fadeUp .45s cubic-bezier(.4,0,.2,1) both}
.pdp-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 100% at 20% 0%,var(--hero-from),transparent 65%);
  pointer-events:none;
}
.pdp-hero-inner{position:relative;z-index:1}
.pdp-hero-row{display:flex;align-items:flex-start;gap:18px}
.pdp-icon{
  width:88px;height:88px;flex:0 0 88px;border-radius:22px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;font-weight:800;color:#fff;
  box-shadow:0 18px 42px -14px rgba(99,102,241,.6),
             inset 0 2px 0 rgba(255,255,255,.18);
  position:relative;
}
.pdp-icon::after{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.26),transparent 55%);pointer-events:none}
.pdp-icon img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1}
.pdp-hero-info{flex:1;min-width:0;padding-top:4px}
.pdp-title{font-size:22px;font-weight:800;letter-spacing:-.5px;
  line-height:1.2;margin-bottom:6px;word-break:break-word}
.pdp-meta{font-size:12.5px;color:var(--muted);font-weight:600;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.pdp-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--muted-2)}
.pdp-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  font-size:10.5px;font-weight:800;letter-spacing:.35px;
  padding:5px 12px;border-radius:999px;text-transform:capitalize;
  color:#fff;line-height:1.4;
}
.chip .ic{width:11px;height:11px;stroke-width:2.6}
.chip.latest, .chip.newest{background:linear-gradient(90deg,#ec4899 0%,#f472b6 30%,#fb923c 100%)}
.chip.hot{background:linear-gradient(90deg,#ef4444 0%,#f97316 100%)}
.chip.old{background:linear-gradient(90deg,#78716c 0%,#a8a29e 100%)}
.chip.new{background:linear-gradient(90deg,#3b82f6 0%,#06b6d4 100%)}
.chip.mod{background:linear-gradient(90deg,#a855f7 0%,#7c3aed 100%)}
.chip.premium{background:linear-gradient(90deg,#fbbf24 0%,#f59e0b 100%);color:#3b2506}
.chip.coming{background:linear-gradient(90deg,#6366f1 0%,#06b6d4 100%)}
.chip.available{background:linear-gradient(90deg,#22c55e 0%,#16a34a 100%)}
.chip.neutral{background:var(--card-3);color:var(--text-2);border:1px solid var(--border)}

.pdp-download-block{
  padding:6px 20px 20px;
  animation:fadeUp .5s .05s cubic-bezier(.4,0,.2,1) both;
  position:relative;
}
.pdp-dl-card{
  position:relative;border-radius:20px;padding:18px;
  background:linear-gradient(135deg,rgba(99,102,241,.14),rgba(168,85,247,.09));
  border:1px solid rgba(99,102,241,.28);
  overflow:hidden;
}
.pdp-dl-card::before{
  content:'';position:absolute;top:-50%;right:-20%;width:200px;height:200px;
  background:radial-gradient(circle,rgba(168,85,247,.24),transparent 70%);
  border-radius:50%;pointer-events:none;
}
.pdp-dl-top{
  display:flex;align-items:center;gap:8px;margin-bottom:13px;position:relative;z-index:1;
  flex-wrap:wrap;
}
.pdp-dl-top .lbl{
  font-size:11px;font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--brand-1);
  display:inline-flex;align-items:center;gap:5px;
}
.pdp-dl-top .lbl .ic{width:12px;height:12px;stroke-width:2.6}
.pdp-dl-version{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:8px;
  background:var(--card);border:1px solid var(--border);
  font-size:11px;font-weight:800;color:var(--text);
}
.pdp-dl-version .ic{width:11px;height:11px;stroke-width:2.4;color:var(--brand-1)}
.pdp-dl-big{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  width:100%;padding:16px 18px;border-radius:16px;
  background:var(--brand-grad);color:#fff;
  box-shadow:0 14px 32px -12px rgba(99,102,241,.85),
             inset 0 1px 0 rgba(255,255,255,.2);
  transition:.2s cubic-bezier(.4,0,.2,1);
  text-decoration:none;position:relative;z-index:1;
}
.pdp-dl-big:hover{filter:brightness(1.08);transform:translateY(-2px);
  box-shadow:0 18px 40px -14px rgba(99,102,241,.95)}
.pdp-dl-big:active{transform:scale(.98)}
.pdp-dl-left{display:flex;align-items:center;gap:13px;min-width:0;flex:1}
.pdp-dl-circle{
  width:44px;height:44px;flex:0 0 44px;border-radius:50%;
  background:rgba(255,255,255,.2);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
}
.pdp-dl-circle .ic{width:20px;height:20px;stroke-width:2.4;color:#fff}
.pdp-dl-texts{min-width:0;flex:1;text-align:left}
.pdp-dl-title{font-size:15px;font-weight:800;letter-spacing:-.2px;line-height:1.2;
  display:flex;align-items:center;gap:7px}
.pdp-dl-title .tag{
  font-size:8.5px;font-weight:900;letter-spacing:.5px;
  padding:2px 6px;border-radius:5px;
  background:rgba(255,255,255,.25);color:#fff;text-transform:uppercase;
}
.pdp-dl-sub{font-size:11.5px;opacity:.88;margin-top:3px;font-weight:600;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pdp-dl-sub .dot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}
.pdp-dl-arrow{
  width:36px;height:36px;flex:0 0 36px;border-radius:50%;
  background:rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
}
.pdp-dl-arrow .ic{width:18px;height:18px;stroke-width:2.6;color:#fff}

.pdp-dl-secondary{
  display:flex;align-items:center;justify-content:center;gap:7px;
  width:100%;padding:12px;border-radius:14px;margin-top:10px;
  background:var(--card);border:1px solid var(--border);
  color:var(--text);font-size:12.5px;font-weight:700;
  transition:.2s;text-decoration:none;position:relative;z-index:1;
}
.pdp-dl-secondary:hover{background:var(--card-2);border-color:var(--border-2);transform:translateY(-1px)}
.pdp-dl-secondary .ic{width:15px;height:15px;stroke-width:2.4;color:var(--brand-1)}
.pdp-dl-secondary .cnt{
  font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:20px;
  background:var(--card-3);color:var(--muted);margin-left:2px;
}

.pdp-section{padding:20px 20px 0;animation:fadeUp .5s cubic-bezier(.4,0,.2,1) both}
.pdp-section:last-of-type{padding-bottom:32px}
.pdp-label{display:flex;align-items:center;gap:10px;
  font-size:11px;font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--muted);margin-bottom:13px}
.pdp-label .ic{width:14px;height:14px;stroke-width:2.4;color:var(--muted-2)}
.pdp-label .ln{flex:1;height:1px;background:var(--border)}
.pdp-label .cnt{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;
  background:var(--card);color:var(--text-2);border:1px solid var(--border)}
.pdp-desc{font-size:14px;line-height:1.85;color:var(--text-2);
  padding:16px 18px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-lg);white-space:pre-wrap;word-break:break-word}

.screenshots{display:flex;gap:12px;overflow-x:auto;padding:2px 0 12px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.screenshots::-webkit-scrollbar{display:none}
.shot{flex:0 0 auto;width:170px;aspect-ratio:9/16;scroll-snap-align:start;
  border-radius:16px;overflow:hidden;cursor:pointer;
  border:1px solid var(--border);background:var(--card);
  position:relative;transition:.25s cubic-bezier(.4,0,.2,1);
  box-shadow:0 8px 20px -10px rgba(0,0,0,.35)}
.shot:hover{transform:translateY(-3px) scale(1.02);border-color:var(--border-2)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}

.v-list{display:flex;flex-direction:column;gap:10px}
.v-item{
  display:flex;align-items:center;gap:14px;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:13px 15px;
  transition:.2s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;
}
.v-item::before{content:'';position:absolute;left:0;top:14%;bottom:14%;width:3px;
  background:var(--brand-grad);border-radius:0 3px 3px 0;opacity:.55;transition:opacity .2s}
.v-item:hover{border-color:var(--border-2);background:var(--card-2);
  transform:translateY(-2px);box-shadow:0 12px 26px -14px rgba(0,0,0,.4)}
.v-item:hover::before{opacity:1}
.v-icon{
  width:42px;height:42px;flex:0 0 42px;border-radius:12px;
  background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(168,85,247,.12));
  border:1px solid rgba(99,102,241,.24);
  display:flex;align-items:center;justify-content:center;color:var(--brand-1);
}
.v-icon .ic{width:19px;height:19px;stroke-width:2.2}
.v-info{flex:1;min-width:0}
.v-name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.v-name{font-size:13.5px;font-weight:800;letter-spacing:-.1px;color:var(--text);word-break:break-word}
.v-sub{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:11px;font-weight:500}
.v-sub span{display:inline-flex;align-items:center;gap:4px}
.v-sub .ic{width:11px;height:11px;stroke-width:2.4}

.dl-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:38px;padding:0 14px;border-radius:11px;flex:0 0 auto;
  background:var(--card-3);color:var(--text);font-size:12px;font-weight:700;
  border:1px solid var(--border-2);cursor:pointer;transition:.18s;
  text-decoration:none;
}
.dl-btn:hover{background:var(--brand-grad);border-color:transparent;color:#fff;
  transform:translateY(-1px);box-shadow:0 6px 16px -6px rgba(99,102,241,.7)}
.dl-btn:active{transform:scale(.95)}
.dl-btn .ic{width:14px;height:14px;stroke-width:2.4}

.pdp-actions{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
}
.pdp-action{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:7px;padding:14px 8px;border-radius:14px;
  background:var(--card);border:1px solid var(--border);
  cursor:pointer;transition:.2s cubic-bezier(.4,0,.2,1);
}
.pdp-action:hover{background:var(--card-2);border-color:var(--border-2);transform:translateY(-2px)}
.pdp-action:active{transform:scale(.96)}
.pdp-action .icon-wrap{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--card-3);transition:.25s;
}
.pdp-action .icon-wrap .ic{width:18px;height:18px;stroke-width:2.2;color:var(--muted)}
.pdp-action .lbl{font-size:11.5px;font-weight:700;color:var(--text)}
.pdp-action.active.like .icon-wrap{background:rgba(239,68,68,.15)}
.pdp-action.active.like .icon-wrap .ic{color:#ef4444;stroke-width:2.6}
.pdp-action.active.like .lbl{color:#ef4444}
.pdp-action.active.save .icon-wrap{background:rgba(99,102,241,.15)}
.pdp-action.active.save .icon-wrap .ic{color:#6366f1;stroke-width:2.6}
.pdp-action.active.save .lbl{color:#6366f1}
.pdp-action.pop .icon-wrap{animation:heartPop .45s cubic-bezier(.4,0,.2,1)}

.waitlist-box{padding:20px;border-radius:var(--radius-lg);
  background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(168,85,247,.05));
  border:1px solid rgba(99,102,241,.22);text-align:center}
.waitlist-box .wl-title{font-size:15px;font-weight:800;margin-bottom:6px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.waitlist-box .wl-sub{font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.6}
.wl-form{display:flex;gap:8px;max-width:400px;margin:0 auto}
.wl-form input{flex:1;height:46px;padding:0 14px;border-radius:12px;
  background:var(--input-bg);border:1px solid var(--border);
  color:var(--text);font-size:13.5px;outline:none;transition:.2s;min-width:0}
.wl-form input:focus{border-color:var(--brand-1);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.wl-form button{height:46px;padding:0 18px;border-radius:12px;
  background:var(--brand-grad);color:#fff;font-weight:700;font-size:13px;
  box-shadow:0 6px 18px -8px rgba(99,102,241,.7);transition:.18s;white-space:nowrap}
.wl-form button:hover{filter:brightness(1.1)}
.wl-form button:disabled{opacity:.55;cursor:not-allowed}
.wl-success{color:#22c55e;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;
  background:rgba(34,197,94,.1);border-radius:12px;border:1px solid rgba(34,197,94,.25)}

.soon-box{width:100%;min-height:60px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(135deg,rgba(99,102,241,.09),rgba(6,182,212,.06));
  border:1px dashed rgba(99,102,241,.32);
  color:#a5b4fc;font-size:14px;font-weight:700;padding:0 20px;text-align:center}
html[data-theme="light"] .soon-box{color:#4f46e5}
.soon-box .ic{width:19px;height:19px;stroke-width:2.2}
.empty-box{padding:22px 20px;text-align:center;
  background:var(--card);border:1px dashed var(--border);
  border-radius:var(--radius-lg);color:var(--muted);font-size:13px;
  display:flex;flex-direction:column;align-items:center;gap:9px}
.empty-box .ic{width:24px;height:24px;stroke-width:1.8;color:var(--muted-2)}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.info-cell{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:13px 14px;display:flex;flex-direction:column;gap:5px}
.info-cell .k{font-size:10.5px;font-weight:800;letter-spacing:.6px;
  text-transform:uppercase;color:var(--muted-2);
  display:flex;align-items:center;gap:5px}
.info-cell .k .ic{width:11px;height:11px;stroke-width:2.4}
.info-cell .v{font-size:13.5px;font-weight:700;color:var(--text);word-break:break-word}

/* ============ MODALS ============ */
.modal-bg{position:fixed;inset:0;background:var(--overlay-bg);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:300;display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;visibility:hidden;transition:.25s;overflow-y:auto}
.modal-bg.show{opacity:1;visibility:visible}
.auth-modal{
  width:100%;max-width:410px;background:var(--bg-elev);
  border:1px solid var(--border);border-radius:24px;
  padding:28px 24px 26px;transform:translateY(20px) scale(.97);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  box-shadow:var(--shadow-lg);position:relative;overflow:hidden;margin:auto;
}
.modal-bg.show .auth-modal{transform:translateY(0) scale(1)}
.auth-modal::before{content:'';position:absolute;top:-40%;left:-20%;right:-20%;height:70%;
  background:radial-gradient(ellipse at center,rgba(99,102,241,.15),transparent 70%);pointer-events:none}
.auth-close{
  position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;
  background:var(--card);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);cursor:pointer;transition:.2s;z-index:5;
}
.auth-close:hover{background:var(--card-2);color:var(--text);transform:scale(1.05)}
.auth-close .ic{width:16px;height:16px;stroke-width:2.4}
.auth-title{font-size:21px;font-weight:800;letter-spacing:-.4px;
  margin-bottom:6px;text-align:center;position:relative;padding:0 30px}
.auth-sub{font-size:12.5px;color:var(--muted);text-align:center;
  margin-bottom:22px;position:relative;padding:0 20px}
.btn-google{width:100%;height:50px;border-radius:14px;cursor:pointer;
  background:var(--card);border:1px solid var(--border);
  color:var(--text);font-size:14px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:.18s;margin-bottom:14px}
.btn-google:hover{background:var(--card-2);border-color:var(--border-2);transform:translateY(-1px)}
.btn-google svg{width:20px;height:20px;flex:0 0 20px}
.auth-divider{display:flex;align-items:center;gap:12px;margin:14px 0 16px;
  font-size:11px;color:var(--muted-2);font-weight:700;letter-spacing:.6px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.field{margin-bottom:13px;position:relative}
.field label{display:flex;justify-content:space-between;align-items:center;
  font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:7px;letter-spacing:.3px}
.field label .forgot{color:var(--brand-1);cursor:pointer;font-weight:700;font-size:11px}
.field label .forgot:hover{text-decoration:underline}
.field input{width:100%;height:50px;padding:0 15px;border-radius:13px;
  background:var(--input-bg);border:1px solid var(--border);
  color:var(--text);font-size:14px;outline:none;transition:.2s;font-family:inherit}
.field input:focus{border-color:var(--brand-1);box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.field input::placeholder{color:var(--muted-2)}
.field .hint{font-size:10.5px;color:var(--muted-2);margin-top:5px;padding-left:3px}
.btn-primary{width:100%;height:52px;border-radius:14px;border:none;cursor:pointer;
  background:var(--brand-grad);color:#fff;font-size:14.5px;font-weight:800;
  font-family:inherit;transition:.18s;margin-top:8px;
  box-shadow:0 10px 24px -10px rgba(99,102,241,.8)}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-ghost{width:100%;height:48px;border-radius:14px;cursor:pointer;
  background:var(--card);border:1px solid var(--border);color:var(--text);
  font-size:13.5px;font-weight:600;transition:.18s;margin-top:10px;
  display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
.btn-ghost:hover{background:var(--card-2);border-color:var(--border-2)}
.btn-ghost.danger{color:#f87171;border-color:rgba(239,68,68,.28)}
.btn-ghost.danger:hover{background:rgba(239,68,68,.08)}
.btn-ghost .ic{width:16px;height:16px;stroke-width:2.2}
.auth-switch{text-align:center;font-size:12.5px;color:var(--muted);margin-top:18px}
.auth-switch b{color:var(--brand-1);cursor:pointer;font-weight:700}
.auth-switch b:hover{text-decoration:underline}
.msg{font-size:12.5px;padding:11px 14px;border-radius:11px;margin-bottom:14px;
  line-height:1.55;display:none;position:relative}
.msg.show{display:block}
.msg.err{background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid rgba(239,68,68,.25)}
.msg.ok{background:rgba(34,197,94,.1);color:#86efac;border:1px solid rgba(34,197,94,.25)}
html[data-theme="light"] .msg.err{color:#b91c1c;background:rgba(239,68,68,.08)}
html[data-theme="light"] .msg.ok{color:#15803d;background:rgba(34,197,94,.08)}
.user-box{text-align:center;padding:6px 0 4px;position:relative}
.user-avatar{width:80px;height:80px;border-radius:50%;margin:0 auto 16px;
  background:var(--brand-grad);display:flex;align-items:center;justify-content:center;
  font-size:31px;font-weight:800;color:#fff;
  box-shadow:0 14px 32px -12px rgba(99,102,241,.7);
  position:relative;overflow:hidden}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-email{font-size:15px;font-weight:700;margin-bottom:6px;word-break:break-all}
.user-note{font-size:11.5px;color:var(--muted);margin-bottom:22px}

/* ============ SETTINGS ============ */
.settings-wrap{padding:18px 14px;max-width:640px;margin:0 auto;
  display:flex;flex-direction:column;gap:14px;animation:fadeUp .4s ease both}
.set-card{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:18px}
html[data-theme="dark"] .set-card{background:linear-gradient(160deg,var(--card),var(--card-2))}
.set-head{font-size:14px;font-weight:800;letter-spacing:-.2px;
  margin-bottom:14px;display:flex;align-items:center;gap:9px}
.set-head .ic{width:16px;height:16px;stroke-width:2.2;color:var(--brand-1)}
.set-row{display:flex;align-items:center;justify-content:space-between;
  gap:14px;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px}
.set-row:last-child{border-bottom:none;padding-bottom:0}
.set-row:first-of-type{padding-top:0}
.set-key{color:var(--text-2);font-weight:600;flex:0 0 auto;display:flex;
  align-items:center;gap:8px}
.set-key .ic{width:15px;height:15px;stroke-width:2.2;color:var(--muted)}
.set-val{font-weight:700;text-align:right;word-break:break-all;color:var(--text)}
.set-val.ok{color:#22c55e}
.theme-toggle{display:flex;background:var(--card-3);border-radius:12px;
  padding:3px;gap:2px;border:1px solid var(--border)}
.theme-opt{padding:8px 14px;border-radius:9px;font-size:12px;font-weight:700;
  cursor:pointer;transition:.2s;color:var(--muted);
  display:flex;align-items:center;gap:6px}
.theme-opt .ic{width:14px;height:14px;stroke-width:2.2}
.theme-opt.active{background:var(--brand-grad);color:#fff;
  box-shadow:0 4px 12px -4px rgba(99,102,241,.6)}
.set-action{display:flex;align-items:center;justify-content:space-between;
  gap:14px;padding:13px 0;border-bottom:1px solid var(--border);
  font-size:13.5px;font-weight:600;cursor:pointer;transition:.2s;border-radius:10px}
.set-action:last-child{border-bottom:none;padding-bottom:0}
.set-action:first-of-type{padding-top:0}
.set-action:hover{padding-left:10px;padding-right:10px;background:var(--card-3);
  margin:0 -10px;border-bottom-color:transparent}
.set-action .left{display:flex;align-items:center;gap:11px}
.set-action .left .ic{width:17px;height:17px;stroke-width:2.2;color:var(--muted)}
.set-action .left .lbl{color:var(--text)}
.set-action .right{display:flex;align-items:center;gap:6px;color:var(--muted-2);font-size:12px}
.set-action .right .ic{width:15px;height:15px;stroke-width:2.4}
.set-action.danger .left .ic,.set-action.danger .left .lbl{color:#f87171}
.switch{position:relative;width:44px;height:26px;flex:0 0 44px;
  background:var(--card-3);border:1px solid var(--border);
  border-radius:20px;cursor:pointer;transition:.25s}
.switch::after{content:'';position:absolute;top:3px;left:3px;
  width:18px;height:18px;border-radius:50%;background:var(--muted);
  transition:.25s cubic-bezier(.4,0,.2,1)}
.switch.on{background:var(--brand-grad);border-color:transparent}
.switch.on::after{left:22px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}

/* TOAST */
.toast{
  position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom, 0px));
  transform:translate(-50%,120px);
  background:var(--card-3);border:1px solid var(--border-2);
  color:var(--text);padding:13px 22px;border-radius:14px;
  font-size:13px;font-weight:600;z-index:800;
  box-shadow:var(--shadow-lg);
  transition:transform .32s cubic-bezier(.4,0,.2,1),opacity .3s;
  white-space:nowrap;max-width:calc(100vw - 40px);overflow:hidden;text-overflow:ellipsis;
  opacity:0;pointer-events:none;
}
.toast.show{transform:translate(-50%,0);opacity:1}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:600;
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:.25s;padding:20px}
.lightbox.show{opacity:1;visibility:visible}
.lightbox img{max-width:100%;max-height:100%;border-radius:16px}
.lightbox-close{position:absolute;top:16px;right:16px;width:44px;height:44px;
  border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);
  color:#fff;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:.2s}
.lightbox-close:hover{background:rgba(255,255,255,.22);transform:scale(1.05)}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;bottom:calc(14px + env(safe-area-inset-bottom, 0px));
  left:50%;transform:translateX(-50%);
  width:calc(100% - 24px);max-width:460px;height:64px;
  display:flex;align-items:center;justify-content:space-around;
  background:var(--glass);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--border);
  border-radius:22px;z-index:90;padding:0 6px;
  box-shadow:0 12px 32px -12px rgba(0,0,0,.45),
             inset 0 1px 0 rgba(255,255,255,.05);
}
.bn-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 10px;border-radius:14px;cursor:pointer;
  color:var(--muted);transition:.25s cubic-bezier(.4,0,.2,1);
  font-size:10px;font-weight:700;min-width:54px;position:relative;
  background:transparent;border:none;
}
.bn-item .ic{width:20px;height:20px;stroke-width:2.2;transition:.25s}
.bn-item.active{color:var(--brand-1)}
.bn-item.active .ic{stroke-width:2.6;transform:scale(1.08)}
.bn-item.active::before{
  content:'';position:absolute;top:2px;left:50%;transform:translateX(-50%);
  width:20px;height:3px;border-radius:3px;
  background:var(--brand-grad);
  box-shadow:0 0 10px rgba(99,102,241,.55);
}
.bn-item:hover{color:var(--text)}
@media(min-width:700px){
  .bottom-nav{display:none}
  .app-main{padding-bottom:56px}
}

/* Profile icon preview in signup */
.input-with-icon{
  position:relative;
}
.input-with-icon input{padding-left:42px}
.input-with-icon .pre-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:var(--muted);pointer-events:none;
}
.input-with-icon .pre-icon .ic{width:16px;height:16px;stroke-width:2.2}
</style>

function categoryIcon(cat){
  const slug = String(cat.slug||'').toLowerCase().trim();
  const nm = String(cat.name||'').toLowerCase().trim();
  if(CATEGORY_ICON_MAP[slug]) return CATEGORY_ICON_MAP[slug];
  if(CATEGORY_ICON_MAP[nm]) return CATEGORY_ICON_MAP[nm];
  for(const k in CATEGORY_ICON_MAP){ if(slug.includes(k) || nm.includes(k)) return CATEGORY_ICON_MAP[k]; }
  return ICONS.box;
}

const GRADIENTS = [
  'linear-gradient(135deg,#6366f1,#a855f7)',
  'linear-gradient(135deg,#f43f5e,#f97316)',
  'linear-gradient(135deg,#0ea5e9,#22d3ee)',
  'linear-gradient(135deg,#10b981,#34d399)',
  'linear-gradient(135deg,#f59e0b,#fbbf24)',
  'linear-gradient(135deg,#8b5cf6,#ec4899)',
  'linear-gradient(135deg,#06b6d4,#3b82f6)',
  'linear-gradient(135deg,#ef4444,#dc2626)',
  'linear-gradient(135deg,#14b8a6,#06b6d4)',
  'linear-gradient(135deg,#d946ef,#8b5cf6)'
];
function gradientFor(name){
  const n = String(name||'?');
  let h = 0;
  for(let i=0;i<n.length;i++) h = (h*31 + n.charCodeAt(i)) >>> 0;
  return GRADIENTS[h % GRADIENTS.length];
}

function badgeClass(b){
  if(!b) return 'default';
  const x = String(b).toLowerCase().replace(/\s+/g,'');
  if(x.includes('latest') || x.includes('newest')) return 'latest';
  if(x.includes('hot') || x.includes('trending')) return 'hot';
  if(x.includes('old') || x.includes('legacy')) return 'old';
  if(x.includes('premium') || x === 'pro' || x.includes('vip')) return 'premium';
  if(x.includes('mod')) return 'mod';
  if(x.includes('coming') || x.includes('soon') || x.includes('upcoming')) return 'coming';
  if(x.includes('new')) return 'new';
  return 'default';
}

const $ = id => document.getElementById(id);
function esc(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function initialOf(name){
  const n = String(name||'?').trim();
  return n ? n.charAt(0).toUpperCase() : '?';
}
function displayNameOf(user){
  if(!user) return '?';
  const md = user.user_metadata || {};
  return md.display_name || md.full_name || md.name || (user.email || 'U').split('@')[0];
}
function usernameOf(user){
  if(!user) return '';
  const md = user.user_metadata || {};
  return md.username || md.handle || '';
}
let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function iconHTML(url, name, cls, style){
  const st = style ? `style="${style}"` : '';
  if(url){
    return `<div class="${cls}" ${st}><img src="${esc(url)}" alt="${esc(name)}" loading="lazy"
      onerror="this.parentNode.innerHTML='${esc(initialOf(name))}';this.parentNode.style.background='${gradientFor(name)}'"></div>`;
  }
  return `<div class="${cls}" ${st} style="background:${gradientFor(name)}">${esc(initialOf(name))}</div>`;
}

  }catch(e){ console.warn('settings:',e.message); state.settings = {}; }
}
async function loadCategories(){

    const { data, error } = await sb.from('categories').select('*').eq('is_active',true).order('priority',{ascending:true});

async function loadProducts(){

    const { data, error } = await sb.from('products').select('*').in('status',['public','coming_soon'])
      .order('priority',{ascending:true}).order('created_at',{ascending:false});

async function loadScreenshots(){
  try{
    const { data, error } = await sb.from('product_screenshots').select('*').order('priority',{ascending:true});

    <div class="cat-item ${state.activeCat==='all'?'active':''}" data-cat="all">

      <div class="cat-item ${String(state.activeCat)===String(c.id)?'active':''}" data-cat="${esc(c.id)}">

      renderAll();

function getFilteredProducts(){
  let list = state.products.slice();
  if(state.activeCat !== 'all') list = list.filter(p => String(p.category_id) === String(state.activeCat));
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    list = list.filter(p => String(p.title||'').toLowerCase().includes(q) || String(p.description||'').toLowerCase().includes(q));
  }
  list.sort((a,b)=>{
    const pa = (a.priority ?? 999), pb = (b.priority ?? 999);
    if(pa !== pb) return pa - pb;
    return (b.id||0) - (a.id||0);
  });
  return list;
}
function currentCategoryInfo(){
  if(state.activeCat === 'all') return { name:'All Items', icon:ICONS.home };
  const c = state.categories.find(x => String(x.id) === String(state.activeCat));
  if(!c) return { name:'All Items', icon:ICONS.home };
  return { name:c.name, icon:categoryIcon(c) };
}

      ${p.badge ? `<span class="badge ${bc}">${esc(p.badge)}</span>` : ''}
      ${iconHTML(p.icon_url, p.title, 'card-icon')}
      <div class="card-name">${esc(p.title)}</div>
      ${coming ? `<div class="soon-tag">${ICONS.clock} Coming Soon</div>` : ''}
    </div>`;
}

function hscrollHTML(p){

function renderContent(){
  const el = $('content');

  if(state.view === 'settings'){
    $('searchWrap').style.display = 'none';
    renderSettings();
    return;
  }

  $('searchWrap').style.display = '';

  if(state.loading){
    el.innerHTML = `<div class="skel-hero"></div><div class="grid">${Array.from({length:6}).map(()=>'<div class="skel"></div>').join('')}</div>`;
    return;
  }

  if(state.search.trim()){
    const list = getFilteredProducts();
    let html = `
      <div class="section-head">
        <div class="section-title"><span class="ico-wrap">${ICONS.search}</span>Search results</div>
        <div class="section-count">${list.length} found</div>
      </div>`;
    if(list.length === 0){
      html += `<div class="state"><div class="big">${ICONS.search}</div><p>No results for "<b>${esc(state.search)}</b>"</p></div>`;
      el.innerHTML = html;
      return;
    }
    html += `<div class="grid">${list.map((p,i)=>cardHTML(p, i*25)).join('')}</div>`;
    el.innerHTML = html;

      return;

  const allPublic = state.products.filter(p => p.status === 'public');

  html += `

            <span>Get App</span>
          </button>
        </div>
      </div>
    </div>`;

  html += `
    <div class="stats-strip">
      <div class="stat-cell">
        <div class="stat-num">${state.products.length}</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-cell">
        <div class="stat-num">${allPublic.length}</div>
        <div class="stat-label">Available</div>
      </div>
      <div class="stat-cell">
        <div class="stat-num">${allComing.length}</div>
        <div class="stat-label">Coming</div>

  html += `
    <div class="chips-row">
      <div class="chip-btn active" data-quick="all">${ICONS.grid} All</div>
      <div class="chip-btn" data-quick="trending">${ICONS.fire} Trending</div>
      <div class="chip-btn" data-quick="latest">${ICONS.sparkle} Latest</div>
      <div class="chip-btn" data-quick="premium">${ICONS.award} Premium</div>
      <div class="chip-btn" data-quick="coming">${ICONS.clock} Coming Soon</div>
    </div>`;

  if(trending.length > 0){
    html += `
      <div class="section-head">
        <div class="section-title"><span class="ico-wrap">${ICONS.fire}</span>Trending Now</div>
        <div class="section-see-all" data-see-all="trending">See all ${ICONS.chevronRight}</div>
      </div>
      <div class="hscroll">${trending.map(hscrollHTML).join('')}</div>`;
  }
  if(latest.length > 0){
    html += `
      <div class="section-head">
        <div class="section-title"><span class="ico-wrap">${ICONS.sparkle}</span>New & Latest</div>
        <div class="section-see-all" data-see-all="latest">See all ${ICONS.chevronRight}</div>

      <div class="section-head">

        <div class="section-count">${allComing.length} upcoming</div>

function bindCards(){
  document.querySelectorAll('.card, .hscroll-item').forEach(card=>{
    card.addEventListener('click', ()=> openProduct(card.dataset.id));
    card.addEventListener('keydown', e=>{
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openProduct(card.dataset.id); }
    });
  });
}
function bindHeroButtons(){
  const dl = document.querySelector('[data-hero-download]');
  if(dl){
    dl.addEventListener('click', ()=>{
      const grid = document.querySelector('.grid');
      if(grid) grid.scrollIntoView({behavior:'smooth', block:'start'});
    });
  }
}
function bindQuickChips(){
  document.querySelectorAll('[data-quick]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      document.querySelectorAll('[data-quick]').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      const q = chip.dataset.quick;
      if(q === 'all'){ state.activeCat = 'all'; renderAll(); }
      else showQuickFilter(q);
      updateBottomNav();
    });
  });
}
function bindSeeAll(){
  document.querySelectorAll('[data-see-all]').forEach(el=>{
    el.addEventListener('click', ()=> showQuickFilter(el.dataset.seeAll));
  });
}
function showQuickFilter(type){
  let list = [], title = '', icon = ICONS.sparkle;
  if(type === 'trending'){ list = state.products.filter(p => badgeClass(p.badge) === 'hot'); title = 'Trending Now'; icon = ICONS.fire; }
  else if(type === 'latest'){ list = state.products.filter(p => { const bc = badgeClass(p.badge); return bc === 'latest' || bc === 'new'; }); title = 'New & Latest'; icon = ICONS.sparkle; }
  else if(type === 'premium'){ list = state.products.filter(p => badgeClass(p.badge) === 'premium'); title = 'Premium Apps'; icon = ICONS.award; }
  else if(type === 'coming'){ list = state.products.filter(p => p.status === 'coming_soon'); title = 'Coming Soon'; icon = ICONS.clock; }

  const el = $('content');
  $('searchWrap').style.display = '';

  let html = `
    <div class="section-head">
      <div class="section-title"><span class="ico-wrap">${icon}</span>${title}</div>
      <div class="section-count">${list.length} item${list.length===1?'':'s'}</div>
    </div>`;
  if(list.length === 0){
    html += `<div class="state"><div class="big">${ICONS.box}</div><p>Nothing here yet.</p></div>`;
  }else{
    html += `<div class="grid">${list.map((p,i)=>cardHTML(p, i*25)).join('')}</div>`;
  }
  el.innerHTML = html;
  bindCards();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============ PRODUCT PAGE ============ */
async function openProduct(id){
  const p = state.products.find(x => String(x.id) === String(id));
  if(!p) return;
  state.currentProduct = p;
  state.pageOpen = true;
  state.versions = [];

  $('productHeaderTitle').textContent = p.title;
  const body = $('productBody');
  body.innerHTML = `
    <div class="pdp-hero">
      <div class="pdp-hero-inner">
        <div class="pdp-hero-row">
          ${iconHTML(p.icon_url, p.title, 'pdp-icon')}
          <div class="pdp-hero-info">
            <div class="pdp-title">${esc(p.title)}</div>
            <div class="pdp-meta">Loading…</div>
          </div>
        </div>
      </div>
    </div>
    <div class="pdp-section"><div class="state" style="padding:26px 0"><div class="spinner"></div></div></div>`;

  $('productPage').classList.add('show');
  document.body.classList.add('locked');

  let versions = [];
  try{
    const { data, error } = await sb.from('product_versions')
      .select('*').eq('product_id', p.id)
      .order('priority',{ascending:true}).order('created_at',{ascending:false});
    if(error) throw error;
    versions = data || [];
  }catch(e){ console.warn('versions:',e.message); }

  if(USE_DEMO_FALLBACK && versions.length === 0 && p.status !== 'coming_soon' && String(p.id) === '1'){
    versions = [
      {id:'d1', version_name:'v12.5.0', file_size:'98 MB', priority:1, download_url:'#', notes:'Latest stable'},
      {id:'d2', version_name:'v12.0.1', file_size:'95 MB', priority:2, download_url:'#', notes:'Stable'},
      {id:'d3', version_name:'v11.8.0', file_size:'92 MB', priority:3, download_url:'#', notes:'Legacy'}
    ];
  }
  if(USE_DEMO_FALLBACK && versions.length === 0 && p.status !== 'coming_soon' && String(p.id) === '2'){
    versions = [{id:'d4', version_name:'v5.0.2', file_size:'112 MB', priority:1, download_url:'#', notes:'Premium unlocked'}];
  }

  state.versions = versions;
  renderProductPage();
}

  const coming = p.status === 'coming_soon';

  const bc = badgeClass(p.badge);
  const shots = state.screenshots[p.id] || [];
  const isLiked = !!state.likes[String(p.id)];
  const isBookmarked = !!state.bookmarks[String(p.id)];

  const latestVer = versions[0] || null;
  const olderVersions = versions.slice(1);

  const hasAnyDownload = !!(latestVer || p.download_url);

  let html = `

        </div>

    const verName = latestVer?.version_name || 'Latest';
    const verSize = latestVer?.file_size || '';
    html += `
      <div class="pdp-download-block">

              <div class="pdp-dl-texts">
                <div class="pdp-dl-title">Download <span class="tag">Latest</span></div>

                  <span>${esc(verName)}</span>

                </div>
              </div>

            <div class="pdp-dl-arrow">${ICONS.chevronRight}</div>
          </a>
          ${olderVersions.length > 0 ? `
            <a class="pdp-dl-secondary" href="#versionsSection">

              <span class="cnt">${olderVersions.length} older</span>

        </div>

  }

  if(p.description){
    html += `
      <div class="pdp-section">
        <div class="pdp-label">${ICONS.info}<span>Description</span><span class="ln"></span></div>
        <div class="pdp-desc">${esc(p.description)}</div>

    <div class="pdp-section">
      <div class="pdp-label">${ICONS.star}<span>Actions</span><span class="ln"></span></div>
      <div class="pdp-actions">

        if(error) throw error;
        $('waitlistBox').innerHTML = `<div class="wl-success">${ICONS.check} You're on the waitlist!</div>`;
      }catch(e){
        toast(e.message || 'Could not join waitlist');
        wlBtn.disabled = false; wlBtn.textContent = 'Notify Me';
      }
    });
  }
}

function closeProduct(){
  $('productPage').classList.remove('show');
  state.pageOpen = false;
  state.currentProduct = null;
  state.versions = [];
  if(!$('authModalBg').classList.contains('show')) document.body.classList.remove('locked');
  setTimeout(()=>{ $('productBody').innerHTML = ''; }, 400);
}

/* ============ AUTH ============ */
function openAuth(){
  renderAuth();
  $('authModalBg').classList.add('show');
  document.body.classList.add('locked');
}
function closeAuth(){
  $('authModalBg').classList.remove('show');
  if(!state.pageOpen) document.body.classList.remove('locked');
  if(state.view !== 'home' && !state.pageOpen){
    state.view = 'home';
    renderContent();
    updateBottomNav();
  }
}
function authMsg(type, text){
  const el = $('authMsg');
  if(!el) return;
  el.className = 'msg show ' + type;
  el.textContent = text;
}

/* ====== COMPLETE PROFILE (after Google OAuth first time) ====== */
function openCompleteProfile(){
  const box = $('authModal');
  const user = state.user;
  if(!user) return;
  const md = user.user_metadata || {};
  const defaultDisplay = md.full_name || md.name || '';
  const defaultUsername = md.username || md.handle || (user.email||'').split('@')[0] || '';

  box.innerHTML = `
    <div class="auth-close" id="authCloseX"><svg class="ic" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    <div class="auth-title">Complete Your Profile</div>
    <div class="auth-sub">Choose your display name and username</div>
    <div class="msg" id="authMsg"></div>

    <div class="field">
      <label>Display Name</label>
      <div class="input-with-icon">
        <span class="pre-icon">${ICONS.idCard}</span>
        <input type="text" id="cpDisplayName" placeholder="e.g. John Doe" maxlength="30" value="${esc(defaultDisplay)}" autocomplete="name">
      </div>
    </div>

    <div class="field">
      <label>Username</label>
      <div class="input-with-icon">
        <span class="pre-icon">${ICONS.at}</span>
        <input type="text" id="cpUsername" placeholder="johndoe" maxlength="20" value="${esc(defaultUsername)}" autocomplete="username">
      </div>
      <div class="hint">Lowercase letters, numbers, _ and . only (3–20 chars)</div>
    </div>

    <button class="btn-primary" id="cpSave">Save</button>
    <button class="btn-ghost" id="cpSkip">Skip for now</button>`;

  $('authCloseX').addEventListener('click', ()=>{
    closeAuth();
  });
  $('cpSkip').addEventListener('click', ()=>{
    closeAuth();
    toast('You can add profile info later');
  });

  $('cpSave').addEventListener('click', async ()=>{
    const dn = $('cpDisplayName').value.trim();
    const un = $('cpUsername').value.trim().toLowerCase();

    if(dn.length < 2){ authMsg('err','Display name must be at least 2 characters.'); return; }
    if(!/^[a-z0-9._]{3,20}$/.test(un)){ authMsg('err','Username must be 3–20 chars (a-z, 0-9, _ .)'); return; }

    const btn = $('cpSave');
    btn.disabled = true; btn.textContent = 'Saving…';

    try{
      const { data, error } = await sb.auth.updateUser({
        data: { display_name: dn, username: un, profile_complete: true }
      });
      if(error) throw error;
      // Update local state immediately
      if(data?.user) state.user = data.user;
      toast('Profile saved!');
      closeAuth();
      renderAccountBtn();
      if(state.view === 'settings') renderSettings();
    }catch(e){
      authMsg('err', e.message || 'Could not save profile.');
    }finally{
      btn.disabled = false; btn.textContent = 'Save';
    }
  });
}

/* ====== EDIT PROFILE (from settings) ====== */
function openEditProfile(){
  const user = state.user;
  if(!user) return;
  const md = user.user_metadata || {};
  const dn = md.display_name || md.full_name || md.name || '';
  const un = md.username || md.handle || '';

  const box = $('authModal');
  box.innerHTML = `
    <div class="auth-close" id="authCloseX"><svg class="ic" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    <div class="auth-title">Edit Profile</div>
    <div class="auth-sub">Update your display name and username</div>
    <div class="msg" id="authMsg"></div>

    <div class="field">
      <label>Display Name</label>
      <div class="input-with-icon">
        <span class="pre-icon">${ICONS.idCard}</span>
        <input type="text" id="epDisplayName" placeholder="e.g. John Doe" maxlength="30" value="${esc(dn)}">
      </div>
    </div>

    <div class="field">
      <label>Username</label>
      <div class="input-with-icon">
        <span class="pre-icon">${ICONS.at}</span>
        <input type="text" id="epUsername" placeholder="johndoe" maxlength="20" value="${esc(un)}">
      </div>
      <div class="hint">Lowercase letters, numbers, _ and . only (3–20 chars)</div>
    </div>

    <button class="btn-primary" id="epSave">Save Changes</button>`;

  $('authCloseX').addEventListener('click', closeAuth);
  $('authModalBg').classList.add('show');
  document.body.classList.add('locked');

  $('epSave').addEventListener('click', async ()=>{
    const newDn = $('epDisplayName').value.trim();
    const newUn = $('epUsername').value.trim().toLowerCase();

    if(newDn.length < 2){ authMsg('err','Display name must be at least 2 characters.'); return; }
    if(!/^[a-z0-9._]{3,20}$/.test(newUn)){ authMsg('err','Username must be 3–20 chars (a-z, 0-9, _ .)'); return; }

    const btn = $('epSave');
    btn.disabled = true; btn.textContent = 'Saving…';

    try{
      const { data, error } = await sb.auth.updateUser({
        data: { display_name: newDn, username: newUn, profile_complete: true }
      });
      if(error) throw error;
      if(data?.user) state.user = data.user;
      toast('Profile updated!');
      closeAuth();
      renderAccountBtn();
      renderSettings();
    }catch(e){
      authMsg('err', e.message || 'Could not save.');
    }finally{
      btn.disabled = false; btn.textContent = 'Save Changes';
    }
  });
}

/* ====== Check profile completeness ====== */
async function checkProfileComplete(){
  if(!state.user) return;
  const md = state.user.user_metadata || {};
  const hasBoth = !!md.username && !!md.display_name;
  if(hasBoth) return;

  // Avoid spamming: use a per-user flag in sessionStorage
  const key = 'profile_prompt_' + state.user.id;
  if(sessionStorage.getItem(key)) return;
  sessionStorage.setItem(key, '1');

  // Small delay for smoothness
  setTimeout(()=> openCompleteProfile(), 400);
}

function renderAuth(){
  const box = $('authModal');

  if(state.user){
    const email = state.user.email || 'user';
    const md = state.user.user_metadata || {};
    const avatar = md.avatar_url;
    const dn = displayNameOf(state.user);
    const un = usernameOf(state.user);
    box.innerHTML = `
      <div class="auth-close" id="authCloseX"><svg class="ic" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
      <div class="user-box">
        <div class="user-avatar">${avatar ? `<img src="${esc(avatar)}" alt="">` : esc(initialOf(dn))}</div>
        <div class="user-email">${esc(dn)}</div>
        ${un ? `<div style="font-size:12px;color:var(--brand-1);margin-bottom:4px">@${esc(un)}</div>` : ''}
        <div class="user-note">${esc(email)}</div>
      </div>
      <button class="btn-ghost" id="editProfileBtn">${ICONS.idCard} Edit Profile</button>
      <button class="btn-ghost" id="goAdmin">${ICONS.wrench} Admin Panel</button>
      <button class="btn-ghost danger" id="logoutBtn">${ICONS.logOut} Sign Out</button>`;
    $('authCloseX').addEventListener('click', closeAuth);
    $('logoutBtn').addEventListener('click', async ()=>{
      await sb.auth.signOut();
      toast('Signed out');
      closeAuth();
      if(state.view === 'settings') renderSettings();
    });
    $('editProfileBtn').addEventListener('click', openEditProfile);
    $('goAdmin').addEventListener('click', ()=>{ window.location.href = 'admin.html'; });
    return;
  }

  let mode = 'login';

  function renderForm(){
    if(mode === 'forgot'){
      box.innerHTML = `
        <div class="auth-close" id="authCloseX"><svg class="ic" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
        <div class="auth-title">Reset Password</div>
        <div class="auth-sub">We'll email you a reset link</div>
        <div class="msg" id="authMsg"></div>
        <div class="field"><label>Email</label><input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email"></div>
        <button class="btn-primary" id="authSubmit">Send Reset Link</button>
        <div class="auth-switch">Remember it? <b id="backToLogin">Back to Sign In</b></div>`;
      $('authCloseX').addEventListener('click', closeAuth);
      bindForm();
      return;
    }

    if(mode === 'signup'){
      /* ====== SIGNUP: Display Name + Username + Email + Password ====== */
      box.innerHTML = `
        <div class="auth-close" id="authCloseX"><svg class="ic" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
        <div class="auth-title">Create Account</div>
        <div class="auth-sub">Fill your details to get started</div>
        <div class="msg" id="authMsg"></div>

        <div class="field">
          <label>Display Name</label>
          <div class="input-with-icon">
            <span class="pre-icon">${ICONS.idCard}</span>
            <input type="text" id="signupDisplayName" placeholder="e.g. John Doe" maxlength="30" autocomplete="name">
          </div>
        </div>

        <div class="field">
          <label>Username</label>
          <div class="input-with-icon">
            <span class="pre-icon">${ICONS.at}</span>
            <input type="text" id="signupUsername" placeholder="johndoe" maxlength="20" autocomplete="username">
          </div>
          <div class="hint">Lowercase letters, numbers, _ and . only (3–20 chars)</div>
        </div>

        <div class="field"><label>Email</label><input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email"></div>
        <div class="field"><label>Password</label><input type="password" id="authPass" placeholder="••••••••" autocomplete="new-password"></div>
        <button class="btn-primary" id="authSubmit">Create Account</button>
        <div class="auth-switch">Already have an account? <b id="switchMode">Sign In</b></div>`;
      $('authCloseX').addEventListener('click', closeAuth);
      $('switchMode').addEventListener('click', ()=>{ mode='login'; renderForm(); });
      bindForm();
      return;
    }

    /* ====== LOGIN: Google + Email + Password ====== */
    box.innerHTML = `
      <div class="auth-close" id="authCloseX"><svg class="ic" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
      <div class="auth-title">Welcome Back</div>
      <div class="auth-sub">Sign in to your account</div>
      <div class="msg" id="authMsg"></div>
      <button class="btn-google" id="googleBtn">${GOOGLE_ICON} Continue with Google</button>
      <div class="auth-divider">OR</div>
      <div class="field"><label>Email</label><input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email"></div>
      <div class="field">
        <label>Password <span class="forgot" id="forgotLink">Forgot password?</span></label>
        <input type="password" id="authPass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-primary" id="authSubmit">Sign In</button>
      <div class="auth-switch">New here? <b id="switchMode">Create an account</b></div>`;

    $('authCloseX').addEventListener('click', closeAuth);
    $('googleBtn').addEventListener('click', async ()=>{
      try{
        const { error } = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: window.location.href } });
        if(error) throw error;
      }catch(e){ authMsg('err', e.message || 'Google sign-in not available yet'); }
    });
    $('forgotLink').addEventListener('click', ()=>{ mode='forgot'; renderForm(); });
    $('switchMode').addEventListener('click', ()=>{ mode='signup'; renderForm(); });
    bindForm();
  }

  function bindForm(){
    const submit = $('authSubmit');
    if($('backToLogin')) $('backToLogin').addEventListener('click', ()=>{ mode='login'; renderForm(); });
    if(!submit) return;

    submit.addEventListener('click', async ()=>{
      const email = $('authEmail').value.trim();
      const pass  = $('authPass') ? $('authPass').value : '';

      if(mode === 'forgot'){
        if(!email){ authMsg('err','Please enter your email.'); return; }
        submit.disabled = true; submit.textContent = 'Sending…';
        try{
          const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
          if(error) throw error;
          authMsg('ok','Reset link sent! Check your email.');
        }catch(e){ authMsg('err', e.message || 'Something went wrong.'); }
        finally{ submit.disabled = false; submit.textContent = 'Send Reset Link'; }
        return;
      }

      /* ====== SIGNUP with username + display name ====== */
      if(mode === 'signup'){
        const dn = $('signupDisplayName').value.trim();
        const un = $('signupUsername').value.trim().toLowerCase();

        if(dn.length < 2){ authMsg('err','Display name must be at least 2 characters.'); return; }
        if(!/^[a-z0-9._]{3,20}$/.test(un)){ authMsg('err','Username must be 3–20 chars (a-z, 0-9, _ .)'); return; }
        if(!email || !pass){ authMsg('err','Please enter email and password.'); return; }
        if(pass.length < 6){ authMsg('err','Password must be at least 6 characters.'); return; }

        submit.disabled = true; submit.textContent = 'Creating account…';
        try{
          const { data, error } = await sb.auth.signUp({
            email,
            password: pass,
            options: {
              data: {
                display_name: dn,
                username: un,
                profile_complete: true
              }
            }
          });
          if(error) throw error;
          if(data.session){
            toast('Account created!');
            if(data.user) state.user = data.user;
            closeAuth();
            renderAccountBtn();
          }else{
            authMsg('ok','Account created. Please check your email to confirm.');
          }
        }catch(e){
          authMsg('err', e.message || 'Something went wrong.');
        }finally{
          submit.disabled = false; submit.textContent = 'Create Account';
        }
        return;
      }

      /* ====== LOGIN with email/password ====== */
      if(!email || !pass){ authMsg('err','Please enter email and password.'); return; }
      if(pass.length < 6){ authMsg('err','Password must be at least 6 characters.'); return; }

      submit.disabled = true; submit.textContent = 'Signing in…';
      try{
        const { error } = await sb.auth.signInWithPassword({ email, password: pass });
        if(error) throw error;
        toast('Signed in');
        closeAuth();
        if(state.view === 'settings') renderSettings();
      }catch(e){ authMsg('err', e.message || 'Something went wrong.'); }
      finally{
        submit.disabled = false; submit.textContent = 'Sign In';
      }
    });

    if($('authPass')) $('authPass').addEventListener('keydown', e=>{ if(e.key === 'Enter') submit.click(); });
  }

  renderForm();
}

function renderAccountBtn(){
  const btn = $('accountBtn');
  const label = $('accLabel');
  if(state.user){
    btn.classList.add('logged-in');
    label.textContent = displayNameOf(state.user);
  }else{
    btn.classList.remove('logged-in');
    label.textContent = 'Account';
  }
}

function openSidebar(){
  $('sidebar').classList.add('show');
  $('overlay').classList.add('show');
  document.body.classList.add('locked');
}
function closeSidebar(){
  $('sidebar').classList.remove('show');
  $('overlay').classList.remove('show');
  if(!state.pageOpen && !$('authModalBg').classList.contains('show')) document.body.classList.remove('locked');
}

function updateBottomNav(){
  document.querySelectorAll('.bn-item').forEach(el=>{
    const nav = el.dataset.nav;
    let active = false;
    if(nav === 'home' && state.view === 'home' && state.activeCat === 'all' && !state.search) active = true;
    if(nav === 'settings' && state.view === 'settings') active = true;
    if(nav === 'search' && state.search) active = true;
    el.classList.toggle('active', active);
  });
}

function bindEvents(){
  $('menuBtn').addEventListener('click', openSidebar);
  $('closeSidebar').addEventListener('click', closeSidebar);
  $('overlay').addEventListener('click', closeSidebar);

  $('navSettings').addEventListener('click', ()=>{
    state.view = 'settings';
    state.activeCat = 'all';
    state.search = '';
    $('searchInput').value = '';
    $('searchClear').classList.remove('show');
    closeSidebar();
    renderCategories();
    renderContent();
    updateBottomNav();
    window.scrollTo({top:0,behavior:'smooth'});
  });

  $('accountBtn').addEventListener('click', openAuth);

  $('searchClear').addEventListener('click', ()=>{
    $('searchInput').value = '';
    state.search = '';
    $('searchClear').classList.remove('show');
    renderContent();
    updateBottomNav();
  });

  let stmr;
  $('searchInput').addEventListener('input', e=>{
    clearTimeout(stmr);
    const val = e.target.value;
    $('searchClear').classList.toggle('show', val.length > 0);
    stmr = setTimeout(()=>{
      state.search = val;
      if(state.view !== 'home') state.view = 'home';
      state.activeCat = 'all';
      renderContent();
      renderCategories();
      updateBottomNav();
    }, 160);
  });

  $('productBack').addEventListener('click', closeProduct);
  $('authModalBg').addEventListener('click', e=>{ if(e.target === $('authModalBg')) closeAuth(); });
  $('lightbox').addEventListener('click', ()=> $('lightbox').classList.remove('show'));
  $('lightboxClose').addEventListener('click', ()=> $('lightbox').classList.remove('show'));

  document.querySelectorAll('.bn-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const nav = el.dataset.nav;
      if(nav === 'home'){
        state.view = 'home'; state.activeCat = 'all'; state.search = '';
        $('searchInput').value = ''; $('searchClear').classList.remove('show');
        renderAll(); updateBottomNav();
        window.scrollTo({top:0,behavior:'smooth'});
      }else if(nav === 'search'){
        state.view = 'home'; state.activeCat = 'all';
        renderContent(); renderCategories(); updateBottomNav();
        window.scrollTo({top:0,behavior:'smooth'});
        setTimeout(()=> $('searchInput').focus(), 250);
      }else if(nav === 'trending'){
        state.view = 'home'; state.activeCat = 'all'; state.search = '';
        $('searchInput').value = ''; $('searchClear').classList.remove('show');
        showQuickFilter('trending');
        document.querySelectorAll('[data-quick]').forEach(c=>{
          c.classList.toggle('active', c.dataset.quick === 'trending');
        });
        updateBottomNav();
      }else if(nav === 'settings'){
        state.view = 'settings'; renderContent(); updateBottomNav();
        window.scrollTo({top:0,behavior:'smooth'});
      }else if(nav === 'account'){
        openAuth();
      }
    });
  });

  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape'){
      if($('lightbox').classList.contains('show')) $('lightbox').classList.remove('show');
      else if($('authModalBg').classList.contains('show')) closeAuth();
      else if(state.pageOpen) closeProduct();
      else closeSidebar();
    }
  });
}

async function init(){
  applyTheme();
  bindEvents();

  const { data:{ session } } = await sb.auth.getSession();
  state.user = session ? session.user : null;
  renderAccountBtn();

  // Check profile completeness for the current session (e.g., returning from Google OAuth)
  if(state.user) checkProfileComplete();

  sb.auth.onAuthStateChange((event, session)=>{
    state.user = session ? session.user : null;
    renderAccountBtn();
    if($('authModalBg').classList.contains('show')) renderAuth();
    if(state.view === 'settings') renderSettings();

    // After sign-in (including Google OAuth), check profile completeness
    if(state.user && (event === 'SIGNED_IN' || event === 'USER_UPDATED')){
      checkProfileComplete();
    }
  });

  await Promise.all([ loadSettings(), loadCategories(), loadProducts(), loadScreenshots() ]);
  applyDemoData();

  state.loading = false;
  renderAll();
  updateBottomNav();
}

init();
</script>
