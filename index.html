<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semx · FlatFusion</title>
    
    <!-- ===== ফেভিকন (Favicon) ===== -->
    <link rel="icon" type="image/x-icon" href="https://www.image2url.com/r2/default/images/1785807108434-d08c04b6-f15b-4e6e-9358-ccca86ea429f.ico" />
    <link rel="shortcut icon" href="https://www.image2url.com/r2/default/images/1785807108434-d08c04b6-f15b-4e6e-9358-ccca86ea429f.ico" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="semx" />
    <link rel="manifest" href="site.webmanifest" />
    

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background: #08080b;
            color: #fff;
            user-select: none;
        }

        /* ----- ব্যাকগ্রাউন্ড ভিডিও (MP4) ----- */
        #bg-wrapper {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background: #08080b;
        }
        #bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.45) saturate(1.1);
        }
        /* ডার্ক ওভারলে */
        #bg-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0, 0, 0, 0.7) 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* ----- ওভারলে (Click to Enter) ----- */
        #overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.9s ease, visibility 0.9s ease;
        }
        #overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        #overlay .content {
            text-align: center;
            animation: float 3.2s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-14px);
            }
        }
        #overlay .content .icon {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, #a78bfa, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
            margin-bottom: 0.2rem;
        }
        #overlay .content h1 {
            font-size: 3rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 0.2rem;
        }
        #overlay .content .sub {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }
        #overlay .content .click-hint {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.8rem 2.4rem;
            border-radius: 60px;
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.02);
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
            transition: 0.3s;
        }
        #overlay .content .click-hint i {
            animation: pulse-arrow 1.6s ease-in-out infinite;
            color: #a78bfa;
        }
        @keyframes pulse-arrow {
            0%,
            100% {
                transform: translateX(0);
                opacity: 0.5;
            }
            50% {
                transform: translateX(7px);
                opacity: 1;
            }
        }
        #overlay .content .click-hint:hover {
            border-color: rgba(167, 139, 250, 0.3);
            background: rgba(167, 139, 250, 0.06);
            color: #fff;
        }

        /* ----- মূল প্রোফাইল কার্ড ----- */
        #main {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1.2s ease 0.4s;
            pointer-events: none;
            padding: 1.5rem;
        }
        #main.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .glass-card {
            width: min(94%, 420px);
            padding: 2.2rem 1.8rem 2rem;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(28px) saturate(1.5);
            -webkit-backdrop-filter: blur(28px) saturate(1.5);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            text-align: center;
        }

        /* অ্যাভাটার */
        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 1.2rem;
        }
        .avatar-wrapper::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            padding: 3px;
            background: conic-gradient(from 0deg, #a78bfa, #6ee7b7, #f472b6, #a78bfa);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: spin 5s linear infinite;
        }
        .avatar-wrapper::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 1.5px solid rgba(167, 139, 250, 0.08);
            animation: spin 8s linear infinite reverse;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #avatar {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        #display-name {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 0.05rem;
        }
        #bio {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 1rem;
        }
        .badge {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            background: rgba(167, 139, 250, 0.12);
            color: #c4b5fd;
            border: 1px solid rgba(167, 139, 250, 0.08);
            margin-bottom: 1.4rem;
        }

        /* সোশ্যাল লিংক */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.3rem;
            text-decoration: none;
            transition: 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .social-btn:hover {
            transform: translateY(-4px) scale(1.06);
            border-color: rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
        }
        .social-btn.youtube:hover {
            background: rgba(255, 0, 0, 0.12);
            border-color: rgba(255, 0, 0, 0.2);
            color: #ff0033;
        }
        .social-btn.tiktok:hover {
            background: rgba(105, 201, 208, 0.10);
            border-color: rgba(105, 201, 208, 0.2);
            color: #69c9d0;
        }
        .social-btn.discord:hover {
            background: rgba(88, 101, 242, 0.12);
            border-color: rgba(88, 101, 242, 0.2);
            color: #5865f2;
        }

        /* ----- মিউজিক কন্ট্রোল ----- */
        #music-controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 0.6rem 1.6rem;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.8s ease 0.6s;
            pointer-events: none;
        }
        #music-controls.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #music-controls button {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.2rem 0.3rem;
            transition: 0.2s;
        }
        #music-controls button:hover {
            color: #fff;
            transform: scale(1.1);
        }
        #music-controls .vol-slider {
            width: 70px;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            outline: none;
        }
        #music-controls .vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #a78bfa;
            cursor: pointer;
            border: none;
        }
        #music-controls .vol-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #a78bfa;
            cursor: pointer;
            border: none;
        }

        /* ----- রেসপন্সিভ ----- */
        @media (max-width: 500px) {
            .glass-card {
                padding: 1.8rem 1.2rem 1.6rem;
                border-radius: 32px;
                width: 96%;
            }
            .avatar-wrapper {
                width: 110px;
                height: 110px;
            }
            #display-name {
                font-size: 1.6rem;
            }
            #bio {
                font-size: 0.85rem;
            }
            .social-btn {
                width: 46px;
                height: 46px;
                font-size: 1.1rem;
            }
            #overlay .content h1 {
                font-size: 2.2rem;
            }
            #music-controls {
                padding: 0.5rem 1.2rem;
                gap: 0.8rem;
                bottom: 20px;
            }
            #music-controls .vol-slider {
                width: 50px;
            }
        }
        @media (max-width: 380px) {
            .avatar-wrapper {
                width: 92px;
                height: 92px;
            }
            #display-name {
                font-size: 1.3rem;
            }
            .social-btn {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            #overlay .content h1 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ওভারলে ===== -->
    <div id="overlay" role="button" aria-label="Click to enter">
        <div class="content">
            <span class="icon">✦</span>
            <h1>Semx</h1>
            <p class="sub">✦ flatfusion ✦</p>
            <div class="click-hint">
                <i class="fas fa-arrow-right"></i> Click anywhere to enter
            </div>
        </div>
    </div>

    <!-- ===== ব্যাকগ্রাউন্ড ভিডিও (MP4) ===== -->
    <div id="bg-wrapper">
        <video id="bg-video" autoplay loop muted playsinline preload="auto">
            <source src="https://www.image2url.com/r2/default/videos/1785799545544-270ab127-18a3-4d59-accb-e77222fc2110.mp4" type="video/mp4" />
            <!-- ফ্যালব্যাক -->
        </video>
    </div>

    <!-- ===== প্রোফাইল কার্ড ===== -->
    <div id="main">
        <div class="glass-card">
            <div class="avatar-wrapper">
                <img id="avatar" src="https://i.ibb.co.com/xtm0Xb1h/New-Project-2-70516-C4.png" alt="avatar" />
            </div>
            <h1 id="display-name">Semx</h1>
            <p id="bio">play.flatfusion.fun</p>
            <span class="badge">✦ FLATFUSION ✦</span>
            <div class="social-links">
                <a href="https://www.youtube.com/@SemxPro" target="_blank" class="social-btn youtube"><i class="fab fa-youtube"></i></a>
                <a href="https://www.tiktok.com/@semxpro?_r=1&_t=ZS-98aO0i1NMBs" target="_blank" class="social-btn tiktok"><i class="fab fa-tiktok"></i></a>
                <a href="https://discord.gg/ZGHKKUx44w" target="_blank" class="social-btn discord"><i class="fab fa-discord"></i></a>
            </div>
        </div>
    </div>

    <!-- ===== মিউজিক কন্ট্রোল ===== -->
    <div id="music-controls">
        <button id="playPauseBtn" aria-label="Play/Pause"><i class="fas fa-play"></i></button>
        <input type="range" id="volumeSlider" class="vol-slider" min="0" max="100" value="60" />
        <button id="muteBtn" aria-label="Mute"><i class="fas fa-volume-up"></i></button>
    </div>

    <!-- ===== অডিও এলিমেন্ট (মিউজিক) ===== -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://www.image2url.com/r2/default/audio/1785798473503-1d51bee2-fa67-4ccc-a724-b67516be43ab.m4a" type="audio/mp4" />
        <!-- ফ্যালব্যাক -->
    </audio>

    <!-- ===== জাভাস্ক্রিপ্ট ===== -->
    <script>
        (function() {
            'use strict';

            // DOM রেফারেন্স
            const overlay = document.getElementById('overlay');
            const main = document.getElementById('main');
            const controls = document.getElementById('music-controls');
            const audio = document.getElementById('bgMusic');
            const playBtn = document.getElementById('playPauseBtn');
            const volumeSlider = document.getElementById('volumeSlider');
            const muteBtn = document.getElementById('muteBtn');

            let isPlaying = false;
            let isMuted = false;

            // প্রাথমিক ভলিউম সেট
            audio.volume = volumeSlider.value / 100;

            // ===== ক্লিক টু এন্টার =====
            overlay.addEventListener('click', function enter(e) {
                overlay.classList.add('hidden');
                main.classList.add('visible');
                controls.classList.add('visible');

                // মিউজিক চালু করি
                audio.play().then(() => {
                    isPlaying = true;
                    updatePlayIcon();
                }).catch((err) => {
                    console.warn('Autoplay blocked, user can click play.', err);
                    isPlaying = false;
                    updatePlayIcon();
                });

                // ভিডিও ইতিমধ্যে autoplay শুরু হয়ে গেছে (HTML অ্যাট্রিবিউটের কারণে)
                // কোনো অতিরিক্ত কাজ নেই

                overlay.removeEventListener('click', enter);
            });

            // ===== প্লে/পজ =====
            playBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                if (audio.paused) {
                    audio.play().then(() => {
                        isPlaying = true;
                        updatePlayIcon();
                    }).catch(() => {});
                } else {
                    audio.pause();
                    isPlaying = false;
                    updatePlayIcon();
                }
            });

            function updatePlayIcon() {
                const icon = playBtn.querySelector('i');
                if (isPlaying) {
                    icon.className = 'fas fa-pause';
                } else {
                    icon.className = 'fas fa-play';
                }
            }

            // ===== ভলিউম =====
            volumeSlider.addEventListener('input', function() {
                const val = parseFloat(this.value);
                audio.volume = val / 100;
                if (isMuted && val > 0) {
                    isMuted = false;
                    audio.muted = false;
                    updateMuteIcon();
                }
                if (val === 0) {
                    isMuted = true;
                    audio.muted = true;
                    updateMuteIcon();
                }
            });

            // ===== মিউট =====
            muteBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                isMuted = !isMuted;
                audio.muted = isMuted;
                if (!isMuted && parseFloat(volumeSlider.value) === 0) {
                    volumeSlider.value = 50;
                    audio.volume = 0.5;
                }
                updateMuteIcon();
            });

            function updateMuteIcon() {
                const icon = muteBtn.querySelector('i');
                if (isMuted) {
                    icon.className = 'fas fa-volume-mute';
                } else {
                    icon.className = 'fas fa-volume-up';
                }
            }

            // ===== অডিও স্টেট ট্র্যাক =====
            audio.addEventListener('play', () => {
                isPlaying = true;
                updatePlayIcon();
            });
            audio.addEventListener('pause', () => {
                isPlaying = false;
                updatePlayIcon();
            });
            audio.addEventListener('ended', () => {
                // loop enabled, so it will restart
                isPlaying = true;
                updatePlayIcon();
            });

            // ===== কিবোর্ড শর্টকাট (Space) =====
            document.addEventListener('keydown', function(e) {
                if (e.target.tagName === 'INPUT') return;
                if (e.code === 'Space') {
                    e.preventDefault();
                    if (!overlay.classList.contains('hidden')) {
                        overlay.click();
                    } else {
                        playBtn.click();
                    }
                }
            });

            console.log('✨ FlatFusion · ভিডিও ও মিউজিক লোড হয়েছে (MP4)।');
        })();
    </script>

</body>
</html>
